services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
  backend:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - mosquitto
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      DATABASE_URL: sqlite:///./smart_home.db
      JWT_SECRET: smarthome_secret_key_2025_licenta
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 1440
    volumes:
      - ./smart_home.db:/app/smart_home.db
    restart: unless-stopped
