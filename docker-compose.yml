services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
  backend:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - mosquitto
    env_file:
      - .env
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    restart: unless-stopped
